[project]
name = "packaging-defects"
version = "1.0.0"
description = "Detection and localisation of pork rasher packaging defects (MMA3001 individual project)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alec Stanley" }]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "scienceplots>=2.2.2",
    "ultralytics>=8.3.0",
]

[project.scripts]
packaging-defects = "packaging_defects.command_line:main"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=8.0",
    "pytest-html>=4.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packaging_defects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The SciencePlots package uses Matplotlib functions that are due to be
# renamed; the warnings come from inside that package, not from this project.
filterwarnings = ["ignore::DeprecationWarning:scienceplots.*"]
